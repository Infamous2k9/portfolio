<div class="legal-page">
  <div class="legal-page__hero">
    <div class="container">
      <app-header />
      <h1 class="page-title legal-page__title">{{ 'privacy.title' | translate }}</h1>
    </div>
  </div>

  <main class="container legal-page__content">
    <a class="legal-page__back" routerLink="/">
      <img src="/images/00_Hand-drawn-lines/03_Portfolio/Breadcrumbs/Breadcrumb arrow 1.png" alt="" />
      {{ 'legal.back' | translate }}
    </a>

    @for (section of sections; track section) {
      <section class="legal-page__section">
        <h2>{{ 'privacy.sections.' + section + '.title' | translate }}</h2>
        <p>{{ 'privacy.sections.' + section + '.text' | translate }}</p>
      </section>
    }

    <p class="legal-page__date">{{ 'privacy.date' | translate }}</p>
  </main>

  <app-footer [ripped]="true" />
</div>
