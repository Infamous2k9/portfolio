<!-- Shared nav list: rendered once in the desktop header and once in the mobile overlay -->
<ng-template #navList>
  <ul class="nav-list">
    @for (link of navLinks; track link.fragment) {
      <li class="nav-item">
        <a class="nav-item__link" routerLink="/" [fragment]="link.fragment" (click)="closeMenu()">
          {{ link.labelKey | translate }}
          <img class="nav-item__hover-img" [src]="link.hoverImage" alt="" />
        </a>
      </li>
    }
  </ul>
</ng-template>

<header class="header">
  <a routerLink="/" class="header__logo" [attr.aria-label]="'header.home' | translate">
    <app-brand-logo />
  </a>

  <nav class="header__nav" [attr.aria-label]="'header.mainNav' | translate">
    <ng-container [ngTemplateOutlet]="navList"></ng-container>
  </nav>

  <app-language-switch class="header__lang" />

  <button
    type="button"
    class="header__burger"
    aria-controls="mobile-menu"
    [attr.aria-expanded]="isMenuOpen()"
    [attr.aria-label]="'header.openMenu' | translate"
    (click)="toggleMenu()"
  >
    <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true">
      <rect y="0" width="24" height="2.67" rx="1.33" />
      <rect y="6.67" width="24" height="2.67" rx="1.33" />
      <rect y="13.33" width="24" height="2.67" rx="1.33" />
    </svg>
  </button>
</header>

<div
  id="mobile-menu"
  class="overlay-nav"
  [class.overlay-nav--active]="isMenuOpen()"
  [attr.inert]="isMenuOpen() ? null : ''"
>
  <div class="nav-mobile">
    <div class="nav-mobile__top">
      <a routerLink="/" class="header__logo" (click)="closeMenu()" [attr.aria-label]="'header.home' | translate">
        <app-brand-logo />
      </a>
      <button
        type="button"
        class="header__burger header__burger--close"
        [attr.aria-label]="'header.closeMenu' | translate"
        (click)="closeMenu()"
      >
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path
            d="M8.77 10.63 2.23 17.17a1.25 1.25 0 0 1-1.87 0 1.25 1.25 0 0 1 0-1.87L6.9 8.77.37 2.23A1.25 1.25 0 0 1 .37.37a1.25 1.25 0 0 1 1.86 0L8.77 6.9 15.3.37a1.25 1.25 0 0 1 1.87 0 1.25 1.25 0 0 1 0 1.86L10.63 8.77l6.54 6.53a1.32 1.32 0 0 1-1.87 1.87l-6.53-6.54Z"
          />
        </svg>
      </button>
    </div>

    <nav class="nav-mobile__middle" [attr.aria-label]="'header.mainNav' | translate">
      <ng-container [ngTemplateOutlet]="navList"></ng-container>
      <app-language-switch />
    </nav>

    <div class="nav-mobile__bottom">
      <app-social-links />
    </div>
  </div>
</div>
