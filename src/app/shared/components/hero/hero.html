<section class="hero-section">
  <div class="container hero-section__inner">
    <app-header />

    <div class="hero-content">
      <div class="hero-content__welcome">
        <img
          class="hero-content__hand"
          src="/icons/waving_hand.png"
          alt=""
          [class.hero-content__hand--animated]="isHoveringWelcome()"
        />
        <button
          type="button"
          class="hero-content__btn btn-pill"
          (mouseenter)="isHoveringWelcome.set(true)"
          (mouseleave)="isHoveringWelcome.set(false)"
          (focus)="isHoveringWelcome.set(true)"
          (blur)="isHoveringWelcome.set(false)"
        >
          <span class="hero-content__btn-text">
            {{ (isHoveringWelcome() ? 'hero.welcomeText' : 'hero.helloWorld') | translate }}
          </span>
        </button>
      </div>

      <h1 class="hero-content__title" [attr.aria-label]="titleLabel">
        <span class="hero-title-first" aria-hidden="true">
          @for (letter of titleFirstLetters; track $index) {
            <span class="letter">{{ letter }}</span>
          }
        </span>
        <span class="hero-title-second" aria-hidden="true">
          @for (letter of titleSecondLetters; track $index) {
            <span class="letter">{{ letter | uppercase }}</span>
          }
        </span>
      </h1>

      <a class="hero-content__cta btn-pill btn-push" routerLink="/" fragment="contact">
        {{ 'hero.btnText' | translate }}
      </a>

      <div
        class="hero-content__profile-img"
        (mouseenter)="isHoveringImg.set(true)"
        (mouseleave)="isHoveringImg.set(false)"
      >
        <img class="profil" src="/images/andre.webp" alt="{{ 'hero.profileAlt' | translate }}" />
        <img class="polaroid" src="/images/03_Stickers/Polaroid-Frame.png" alt="" />
        <p class="name-tag" aria-hidden="true">{{ isHoveringImg() ? 'André :D' : 'André :)' }}</p>
      </div>
    </div>

    <app-social-links class="hero-section__social" [verticalOnDesktop]="true" />
  </div>
</section>
